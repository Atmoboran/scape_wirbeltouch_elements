<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="">
<!-- The design (colours, fonts, icons, logo, texts) comes from themes/<name>/.
     ?theme=<name> in the URL overrides this default. -->
<meta name="wirbeltouch-theme" content="scape">
<title></title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<div id="stage">
  <canvas id="sim"></canvas>
  <canvas id="overlay"></canvas>
</div>

<header id="topbar">
  <div class="brand">
    <div id="brand-mark" hidden></div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="top-actions">
    <button id="btn-lang" class="chip" type="button" data-i18n="langSwitch"></button>
    <button id="btn-help" class="chip" type="button" data-i18n-title="help">
      <svg data-icon="help"></svg>
    </button>
    <button id="btn-fullscreen" class="chip" type="button" data-i18n-title="fullscreen">
      <svg data-icon="fullscreen"></svg>
    </button>
    <button id="btn-settings" class="chip" type="button" data-i18n-title="settings">
      <svg data-icon="settings"></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" data-i18n="hintPlace"></p>

<button id="trash" type="button" hidden data-i18n-title="dropToDelete">
  <svg data-icon="bin"></svg>
  <span data-i18n="binLabel"></span>
</button>

<div id="dock">
  <button id="dock-toggle" class="dock-toggle" type="button" aria-expanded="true">
    <svg data-icon="chevron"></svg>
    <span id="dock-toggle-label" data-i18n="hideTools"></span>
  </button>

  <div id="dock-body">
    <div id="tools" role="radiogroup" data-i18n-title="tools">
      <div class="toolgroup" role="group" data-i18n-title="groupShapes">
        <span class="groupcap" data-i18n="groupShapes"></span>
        <div class="toolrow">
          <button class="tool solid" type="button" data-tool="circle" data-i18n-title="toolCircle">
            <svg data-icon="circle"></svg>
            <span data-i18n="toolCircle"></span>
          </button>
          <button class="tool solid" type="button" data-tool="square" data-i18n-title="toolSquare">
            <svg data-icon="square"></svg>
            <span data-i18n="toolSquare"></span>
          </button>
          <button class="tool solid" type="button" data-tool="plate" data-i18n-title="toolPlate">
            <svg data-icon="plate"></svg>
            <span data-i18n="toolPlate"></span>
          </button>
          <button class="tool solid" type="button" data-tool="airfoil" data-i18n-title="toolAirfoil">
            <svg data-icon="airfoil"></svg>
            <span data-i18n="toolAirfoil"></span>
          </button>
          <button class="tool solid" type="button" data-tool="hill" data-i18n-title="toolHill">
            <svg data-icon="hill"></svg>
            <span data-i18n="toolHill"></span>
          </button>
          <button class="tool" type="button" data-tool="brush" data-i18n-title="toolBrush">
            <svg data-icon="brush"></svg>
            <span data-i18n="toolBrush"></span>
          </button>
        </div>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="toolgroup" role="group" data-i18n-title="groupDevices">
        <span class="groupcap" data-i18n="groupDevices"></span>
        <div class="toolrow">
          <button class="tool device" type="button" data-tool="fan" data-i18n-title="toolFan">
            <svg data-icon="fan"></svg>
            <span data-i18n="toolFan"></span>
          </button>
          <button class="tool device" type="button" data-tool="rotor" data-i18n-title="toolRotor">
            <svg data-icon="rotor"></svg>
            <span data-i18n="toolRotor"></span>
          </button>
          <button class="tool device" type="button" data-tool="sink" data-i18n-title="toolSink">
            <svg data-icon="sink"></svg>
            <span data-i18n="toolSink"></span>
          </button>
          <button class="tool device" type="button" data-tool="chimney" data-i18n-title="toolChimney">
            <svg data-icon="chimney"></svg>
            <span data-i18n="toolChimney"></span>
          </button>
        </div>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="toolgroup" role="group" data-i18n-title="groupHand">
        <span class="groupcap" data-i18n="groupHand"></span>
        <div class="toolrow">
          <button class="tool" type="button" data-tool="stir" data-i18n-title="toolStirTitle">
            <svg data-icon="stir"></svg>
            <span data-i18n="toolStir"></span>
          </button>
          <button class="tool" type="button" data-tool="eraser" data-i18n-title="toolEraser">
            <svg data-icon="eraser"></svg>
            <span data-i18n="toolEraser"></span>
          </button>
        </div>
      </div>
    </div>

    <div id="shapebar">
      <label class="dock-slider">
        <span id="dock-size-label" data-i18n="size"></span>
        <input id="in-dock-size" type="range" min="2" max="30" step="0.5" value="7">
        <output id="out-dock-size"></output>
      </label>
      <div id="rotate-group" class="rotate">
        <button id="btn-rot-left" class="chip" type="button" data-i18n-title="rotateLeft">
          <svg data-icon="rotateLeft"></svg>
        </button>
        <output id="out-dock-angle" data-i18n-title="angle"></output>
        <button id="btn-rot-right" class="chip" type="button" data-i18n-title="rotateRight">
          <svg data-icon="rotateRight"></svg>
        </button>
      </div>
    </div>

    <div id="actions">
      <button id="btn-wind" class="action primary switch" type="button" aria-pressed="false" data-i18n-title="windTitle">
        <svg data-icon="wind"></svg>
        <span id="wind-label" data-i18n="windLabel"></span>
        <i class="knob" aria-hidden="true"><b id="wind-state"></b></i>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button id="btn-pause" class="action" type="button">
        <svg class="icon-pause" data-icon="pause"></svg>
        <svg class="icon-play" data-icon="play"></svg>
        <span id="pause-label" data-i18n="pause"></span>
      </button>
      <button id="btn-reset" class="action" type="button">
        <svg data-icon="reset"></svg>
        <span data-i18n="resetFlow"></span>
      </button>
      <button id="btn-undo" class="action" type="button">
        <svg data-icon="undo"></svg>
        <span data-i18n="undo"></span>
      </button>
      <button id="btn-clear" class="action" type="button">
        <svg data-icon="bin"></svg>
        <span data-i18n="clear"></span>
      </button>
    </div>
  </div>
</div>

<aside id="panel" hidden>
  <div class="panel-head">
    <h2 data-i18n="settings"></h2>
    <button id="panel-close" class="chip" type="button" data-i18n-title="close">
      <svg data-icon="close"></svg>
    </button>
  </div>

  <section>
    <h3><span data-i18n="scenes"></span><button class="info" type="button" data-info="infoScenes" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></h3>
    <p class="infobox" data-html id="infoScenes" data-i18n-html="infoScenes" hidden></p>
    <select id="scene-select" class="dropdown">
      <option value="" data-i18n="sceneCustom"></option>
      <optgroup data-i18n-label="groupBasics">
        <option value="cylinder" data-i18n="sceneCylinder"></option>
        <option value="tandem" data-i18n="sceneTandem"></option>
        <option value="airfoil" data-i18n="sceneAirfoil"></option>
        <option value="stall" data-i18n="sceneStall"></option>
        <option value="plate" data-i18n="scenePlate"></option>
        <option value="bridge" data-i18n="sceneBridge"></option>
      </optgroup>
      <optgroup data-i18n-label="groupDevices">
        <option value="magnus" data-i18n="sceneMagnus"></option>
        <option value="jet" data-i18n="sceneJet"></option>
        <option value="chimney" data-i18n="sceneChimney"></option>
        <option value="extraction" data-i18n="sceneExtraction"></option>
      </optgroup>
      <optgroup data-i18n-label="groupCity">
        <option value="building" data-i18n="sceneBuilding"></option>
        <option value="skyline" data-i18n="sceneSkyline"></option>
        <option value="canyon" data-i18n="sceneCanyon"></option>
      </optgroup>
      <optgroup data-i18n-label="groupLand">
        <option value="mountains" data-i18n="sceneMountains"></option>
        <option value="wallSolid" data-i18n="sceneWallSolid"></option>
        <option value="fence" data-i18n="sceneFence"></option>
        <option value="windfarm" data-i18n="sceneWindfarm"></option>
      </optgroup>
      <optgroup data-i18n-label="groupChannel">
        <option value="venturi" data-i18n="sceneVenturi"></option>
        <option value="slit" data-i18n="sceneSlit"></option>
      </optgroup>
      <optgroup data-i18n-label="groupVent">
        <option value="roomOne" data-i18n="sceneRoomOne"></option>
        <option value="roomCross" data-i18n="sceneRoomCross"></option>
      </optgroup>
      <optgroup data-i18n-label="groupOther">
        <option value="empty" data-i18n="sceneEmpty"></option>
      </optgroup>
    </select>
  </section>

  <section>
    <h3><span data-i18n="medium"></span><button class="info" type="button" data-info="infoMedium" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></h3>
    <p class="infobox" data-html id="infoMedium" data-i18n-html="infoMedium" hidden></p>
    <div id="media" class="pillrow">
      <button class="pill" type="button" data-medium="air" data-i18n="mediumAir"></button>
      <button class="pill" type="button" data-medium="water" data-i18n="mediumWater"></button>
    </div>
  </section>

  <section>
    <h3><span data-i18n="direction"></span><button class="info" type="button" data-info="infoDirection" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></h3>
    <p class="infobox" data-html id="infoDirection" data-i18n-html="infoDirection" hidden></p>
    <div id="dirs" class="pillrow">
      <button class="pill" type="button" data-dir="right" data-i18n="dirRight"></button>
      <button class="pill" type="button" data-dir="left" data-i18n="dirLeft"></button>
      <button class="pill" type="button" data-dir="down" data-i18n="dirDown"></button>
      <button class="pill" type="button" data-dir="up" data-i18n="dirUp"></button>
      <button class="pill" type="button" data-dir="off" data-i18n="dirOff"></button>
    </div>
  </section>

  <section>
    <h3><span data-i18n="view"></span><button class="info" type="button" data-info="infoView" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></h3>
    <p class="infobox" data-html id="infoView" data-i18n-html="infoView" hidden></p>
    <div id="views" class="pillrow">
      <button class="pill" type="button" data-view="0" data-i18n="viewDye"></button>
      <button class="pill" type="button" data-view="1" data-i18n="viewSpeed"></button>
      <button class="pill" type="button" data-view="2" data-i18n="viewVorticity"></button>
      <button class="pill" type="button" data-view="3" data-i18n="viewPressure"></button>
    </div>
  </section>

  <section>
    <h3><span data-i18n="smokeStyle"></span><button class="info" type="button" data-info="infoSmoke" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></h3>
    <p class="infobox" data-html id="infoSmoke" data-i18n-html="infoSmoke" hidden></p>
    <div id="smokemodes" class="pillrow">
      <button class="pill" type="button" data-smoke="0" data-i18n="smokeLines"></button>
      <button class="pill" type="button" data-smoke="1" data-i18n="smokeSheet"></button>
    </div>
  </section>

  <section class="sliders">
    <div class="slider">
      <label>
        <span><span data-i18n="windSpeed"></span><button class="info" type="button" data-info="infoWind" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></span>
        <output id="out-wind"></output>
      </label>
      <input id="in-wind" type="range" min="5" max="140" step="1" value="50">
      <p class="infobox" data-html id="infoWind" data-i18n-html="infoWind" hidden></p>
    </div>
    <div class="slider">
      <label>
        <span><span data-i18n="stripes"></span><button class="info" type="button" data-info="infoStripes" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></span>
        <output id="out-stripes"></output>
      </label>
      <input id="in-stripes" type="range" min="4" max="48" step="1" value="22">
      <p class="infobox" data-html id="infoStripes" data-i18n-html="infoStripes" hidden></p>
    </div>
    <div class="slider">
      <label>
        <span><span data-i18n="vorticity"></span><button class="info" type="button" data-info="infoVorticity" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></span>
        <output id="out-curl"></output>
      </label>
      <input id="in-curl" type="range" min="0" max="40" step="1" value="6">
      <p class="infobox" data-html id="infoVorticity" data-i18n-html="infoVorticity" hidden></p>
    </div>
    <div class="slider">
      <label>
        <span><span data-i18n="fade"></span><button class="info" type="button" data-info="infoFade" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></span>
        <output id="out-fade"></output>
      </label>
      <input id="in-fade" type="range" min="0" max="200" step="1" value="12">
      <p class="infobox" data-html id="infoFade" data-i18n-html="infoFade" hidden></p>
    </div>
    <div class="slider">
      <label>
        <span><span data-i18n="quality"></span><button class="info" type="button" data-info="infoQuality" data-i18n-title="moreInfo" data-i18n="infoGlyph"></button></span>
        <output id="out-quality"></output>
      </label>
      <input id="in-quality" type="range" min="0" max="3" step="1" value="2">
      <p class="infobox" data-html id="infoQuality" data-i18n-html="infoQuality" hidden></p>
    </div>
  </section>
</aside>

<div id="help" class="modal" hidden>
  <div class="sheet">
    <h2 data-i18n="helpTitle"></h2>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" data-tab="tab-basic" data-i18n="helpTabBasic"></button>
      <button class="tab" type="button" data-tab="tab-advanced" data-i18n="helpTabAdvanced"></button>
    </div>
    <div class="prose" id="tab-basic" data-i18n-html="helpBody"></div>
    <div class="prose" id="tab-advanced" data-i18n-html="helpAdvanced" hidden></div>
    <p class="claim" data-i18n="helpFooter"></p>
    <button id="help-close" class="action primary" type="button" data-i18n="close"></button>
  </div>
</div>

<div id="fatal" class="modal" hidden>
  <div class="sheet">
    <p id="fatal-text" data-i18n="noWebGL"></p>
    <p id="fatal-detail" class="detail"></p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
