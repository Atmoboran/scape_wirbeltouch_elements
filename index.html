<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="WirbelTouch - ein Windkanal zum Anfassen: Hindernisse in die Strömung setzen und zusehen, wie die Luft darum herum fliesst. Läuft komplett im Browser.">
<meta name="theme-color" content="#0a0f1a">
<title>WirbelTouch – Strömung zum Anfassen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230a0f1a'/><path d='M4 12h12a5 5 0 1 1 5 5' stroke='%2359d2ff' stroke-width='2.5' fill='none' stroke-linecap='round'/><path d='M4 20h9' stroke='%23ff8c42' stroke-width='2.5' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="sim"></canvas>
  <canvas id="overlay"></canvas>
</div>

<header id="topbar">
  <div class="brand">
    <h1 data-i18n="title">WirbelTouch</h1>
    <p data-i18n="subtitle">Strömung zum Anfassen</p>
  </div>
  <div class="top-actions">
    <button id="btn-lang" class="chip" type="button">EN</button>
    <button id="btn-help" class="chip" type="button" data-i18n-title="help">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.6 2.8c-.6.2-.8.7-.8 1.3v.6"/><circle cx="12" cy="17.2" r="1.05" class="fill"/></svg>
    </button>
    <button id="btn-fullscreen" class="chip" type="button" data-i18n-title="fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="btn-settings" class="chip" type="button" data-i18n-title="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" data-i18n="hintPlace"></p>

<div id="dock">
  <div id="tools" role="radiogroup" aria-label="Werkzeuge">
    <button class="tool" type="button" data-tool="stir" data-i18n-title="toolStir">
      <svg viewBox="0 0 24 24"><path d="M3 8h9.5a3.2 3.2 0 1 1 3.2 3.2H3"/><path d="M3 16h7.8a2.6 2.6 0 1 0-2.6-2.6"/></svg>
      <span data-i18n="toolStir"></span>
    </button>
    <button class="tool" type="button" data-tool="circle" data-i18n-title="toolCircle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg>
      <span data-i18n="toolCircle"></span>
    </button>
    <button class="tool" type="button" data-tool="square" data-i18n-title="toolSquare">
      <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
      <span data-i18n="toolSquare"></span>
    </button>
    <button class="tool" type="button" data-tool="plate" data-i18n-title="toolPlate">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="10.4" width="17" height="3.2" rx="1.5" transform="rotate(-25 12 12)"/></svg>
      <span data-i18n="toolPlate"></span>
    </button>
    <button class="tool" type="button" data-tool="airfoil" data-i18n-title="toolAirfoil">
      <svg viewBox="0 0 24 24"><path d="M3.5 14.5c4-5.5 10-8 17-8-3.5 5.5-9.5 9-17 8Z"/></svg>
      <span data-i18n="toolAirfoil"></span>
    </button>
    <button class="tool" type="button" data-tool="hill" data-i18n-title="toolHill">
      <svg viewBox="0 0 24 24"><path d="M3 19 12 5l9 14Z"/></svg>
      <span data-i18n="toolHill"></span>
    </button>
    <button class="tool" type="button" data-tool="brush" data-i18n-title="toolBrush">
      <svg viewBox="0 0 24 24"><path d="M4 20c2.5.4 4.2-.6 5-2.6M17.6 3.9 20 6.3 9.6 16.8l-3.4 1 1-3.4Z"/></svg>
      <span data-i18n="toolBrush"></span>
    </button>
    <button class="tool" type="button" data-tool="eraser" data-i18n-title="toolEraser">
      <svg viewBox="0 0 24 24"><path d="M8.5 19h11M4.4 15.2 9 19.6l10-10-4.6-4.6Z"/></svg>
      <span data-i18n="toolEraser"></span>
    </button>
  </div>

  <div id="actions">
    <button id="btn-wind" class="action primary" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 8h11.2a2.9 2.9 0 1 0-2.9-2.9"/><path d="M3 12.5h14.6a2.9 2.9 0 1 1-2.9 2.9"/><path d="M3 17h7.5"/></svg>
      <span id="wind-label" data-i18n="windOn"></span>
    </button>
    <button id="btn-pause" class="action" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      <span id="pause-label" data-i18n="pause"></span>
    </button>
    <button id="btn-reset" class="action" type="button">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      <span data-i18n="resetFlow"></span>
    </button>
    <button id="btn-undo" class="action" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 9h9.5a5.5 5.5 0 0 1 0 11H9"/><path d="M8 4.5 3.5 9 8 13.5"/></svg>
      <span data-i18n="undo"></span>
    </button>
    <button id="btn-clear" class="action" type="button">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M9.5 7V4.8h5V7M6.7 7l.9 12.2h8.8L17.3 7"/></svg>
      <span data-i18n="clear"></span>
    </button>
  </div>
</div>

<aside id="panel" hidden>
  <div class="panel-head">
    <h2 data-i18n="settings">Einstellungen</h2>
    <button id="panel-close" class="chip" type="button" aria-label="close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <section>
    <h3 data-i18n="scenes">Szenen</h3>
    <div id="presets" class="pillrow">
      <button class="pill" type="button" data-preset="cylinder" data-i18n="sceneCylinder"></button>
      <button class="pill" type="button" data-preset="airfoil" data-i18n="sceneAirfoil"></button>
      <button class="pill" type="button" data-preset="plate" data-i18n="scenePlate"></button>
      <button class="pill" type="button" data-preset="tandem" data-i18n="sceneTandem"></button>
      <button class="pill" type="button" data-preset="building" data-i18n="sceneBuilding"></button>
      <button class="pill" type="button" data-preset="mountains" data-i18n="sceneMountains"></button>
      <button class="pill" type="button" data-preset="venturi" data-i18n="sceneVenturi"></button>
      <button class="pill" type="button" data-preset="slit" data-i18n="sceneSlit"></button>
      <button class="pill" type="button" data-preset="empty" data-i18n="sceneEmpty"></button>
    </div>
  </section>

  <section>
    <h3 data-i18n="view">Ansicht</h3>
    <div id="views" class="pillrow">
      <button class="pill" type="button" data-view="0" data-i18n="viewDye"></button>
      <button class="pill" type="button" data-view="1" data-i18n="viewSpeed"></button>
      <button class="pill" type="button" data-view="2" data-i18n="viewVorticity"></button>
      <button class="pill" type="button" data-view="3" data-i18n="viewPressure"></button>
    </div>
  </section>

  <section>
    <h3 data-i18n="smokeStyle">Rauchbild</h3>
    <div id="smokemodes" class="pillrow">
      <button class="pill" type="button" data-smoke="0" data-i18n="smokeLines"></button>
      <button class="pill" type="button" data-smoke="1" data-i18n="smokeSheet"></button>
    </div>
  </section>

  <section class="sliders">
    <label class="slider">
      <span><span data-i18n="windSpeed"></span><output id="out-wind"></output></span>
      <input id="in-wind" type="range" min="5" max="140" step="1" value="55">
    </label>
    <label class="slider">
      <span><span data-i18n="size"></span><output id="out-size"></output></span>
      <input id="in-size" type="range" min="2" max="30" step="0.5" value="11">
    </label>
    <label class="slider">
      <span><span data-i18n="angle"></span><output id="out-angle"></output></span>
      <input id="in-angle" type="range" min="-90" max="90" step="1" value="10">
    </label>
    <label class="slider">
      <span><span data-i18n="stripes"></span><output id="out-stripes"></output></span>
      <input id="in-stripes" type="range" min="4" max="48" step="1" value="22">
    </label>
    <label class="slider">
      <span><span data-i18n="vorticity"></span><output id="out-curl"></output></span>
      <input id="in-curl" type="range" min="0" max="40" step="1" value="8">
    </label>
    <label class="slider">
      <span><span data-i18n="fade"></span><output id="out-fade"></output></span>
      <input id="in-fade" type="range" min="0" max="200" step="1" value="35">
    </label>
    <label class="slider">
      <span><span data-i18n="quality"></span><output id="out-quality"></output></span>
      <input id="in-quality" type="range" min="0" max="3" step="1" value="2">
    </label>
  </section>
</aside>

<div id="help" class="modal" hidden>
  <div class="sheet">
    <h2 data-i18n="helpTitle">So funktioniert es</h2>
    <div class="prose" data-i18n-html="helpBody"></div>
    <button id="help-close" class="action primary" type="button" data-i18n="close">Schließen</button>
  </div>
</div>

<div id="fatal" class="modal" hidden>
  <div class="sheet">
    <p id="fatal-text" data-i18n="noWebGL"></p>
    <p id="fatal-detail" class="detail"></p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
